name: Genesis benchmark

on:
  push:
    paths-ignore:
      - "results/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (measures, projector, synthetic motor imagery, MOABB end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  benchmark:
    name: Benchmark on 50 stroke patients and 9 healthy participants
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore downloaded recordings
        uses: actions/cache@v6
        with:
          path: ~/mne_data
          key: eeg-liu2024-bnci2014_001-v1

      - name: Run the pre-registered benchmark
        run: python -m benchmark.run --out results

      - name: Summary
        if: always()
        shell: bash
        run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The benchmark did not finish." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the results to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/results.csv results/stats.csv results/gate.csv results/summary.json results/summary.md
          git commit -m "Benchmark results for ${GITHUB_SHA::7}" || exit 0
          git push
