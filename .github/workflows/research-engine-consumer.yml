name: Consume Mathematical City research engine
on:
  push:
    paths:
      - '.github/workflows/research-engine-consumer.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'
permissions:
  contents: read
jobs:
  upstream-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nicholaskouns-create/Radar
          ref: 512a4fe5eb90f0e43c2bd569a1a6990f5241d77b
          path: research-engine-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate upstream evidence contract
        working-directory: research-engine-upstream
        run: |
          python -m pip install pytest
          python -m pytest tests/test_research_engine.py -q
          python - <<'PY'
          from research_engine.sources import SOURCES
          assert 'acicula-iq-v3' in SOURCES
          assert SOURCES['acicula-iq-v3']['labels_verified'] is False
          print('Pinned upstream evidence contract validated')
          PY
      - name: Publish immutable consumer receipt
        if: success()
        env:
          CONSUMER_REPO: ${{ github.repository }}
          CONSUMER_SHA: ${{ github.sha }}
          CONSUMER_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,json
          receipt={'schema_version':'1.0','producer':os.environ['CONSUMER_REPO'],
                   'commit':os.environ['CONSUMER_SHA'],'run_id':os.environ['CONSUMER_RUN'],
                   'upstream_contract':'46f696fd9479e4dcade7ffb0c79ac7978f6a9bf6',
                   'check':'shared_contract_and_public_registry','status':'passed',
                   'evidence':'integration_smoke_only'}
          with open('consumer-receipt.json','w') as out:json.dump(receipt,out,sort_keys=True,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mathematical-city-consumer-receipt
          path: consumer-receipt.json
          retention-days: 30
